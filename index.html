
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comfort Sofa | Premium Sofa & Room Design</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f3ee;
      color: #222;
    }

    header {
      background: #24170f;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .menu {
      font-size: 25px;
      cursor: pointer;
    }

    .hero {
      padding: 55px 22px;
      text-align: center;
      background: linear-gradient(135deg, #3b2618, #8b5e3c);
      color: white;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      margin: 5px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      background: white;
      color: #4b2e1d;
    }

    .section {
      padding: 35px 18px;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    .card .photo {
      height: 150px;
      background: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      font-size: 14px;
    }

    .card-content {
      padding: 14px;
    }

    .card h3 {
      margin-bottom: 7px;
      font-size: 17px;
    }

    .price {
      color: #8b542f;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .order {
      display: block;
      text-align: center;
      background: #24170f;
      color: white;
      padding: 9px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }

    .about {
      background: white;
      text-align: center;
      line-height: 1.7;
    }

    .contact {
      background: #24170f;
      color: white;
      text-align: center;
    }

    .contact h2 {
      margin-bottom: 15px;
    }

    footer {
      background: #160d08;
      color: #aaa;
      text-align: center;
      padding: 18px;
      font-size: 13px;
    }

    @media(max-width: 400px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🛋️ Comfort Sofa</div>
    <div class="menu">☰</div>
  </header>

  <section class="hero">
    <h1>Comfort Sofa</h1>

    <p>
      Premium Sofa • Modern Designs • Quality Fabrics
      <br>
      Apne ghar ko dijiye ek naya look.
    </p>

    <a href="#catalogue" class="btn">Catalogue Dekhein</a>
    <a href="#contact" class="btn">Contact Karein</a>
  </section>

  <section class="section" id="catalogue">

    <h2>Our Sofa Collection</h2>

    <div class="cards">

      <div class="card">
        <div class="photo">
          Sofa Photo
        </div>

        <div class="card-content">
          <h3>Modern Sofa</h3>
          <div class="price">₹25,000</div>

          <a class="order"
