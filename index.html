<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comfort Sofa | Premium Furniture</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #24170f;
    }

    header {
      background: #24170f;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      font-size: 12px;
      margin-top: 5px;
      opacity: .8;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #3b2618, #9b6b45);
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      margin: 5px;
      border-radius: 30px;
      background: white;
      color: #3b2618;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 40px 16px;
      max-width: 1100px;
      margin: auto;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .catalogue {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 12px;
      color: #8b542f;
    }

    .order {
      display: block;
      background: #24170f;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 9px;
      text-decoration: none;
    }

    .about {
      background: white;
      text-align: center;
      line-height: 1.8;
    }

    .contact {
      background: #24170f;
      color: white;
      text-align: center;
    }

    footer {
      background: #160d08;
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .catalogue {
        grid-template-columns: 1fr;
      }

      .card img {
        height: 260px;
      }

      .hero h2 {
        font-size: 32px;
      }
    }
  </style>
</head>
